[project]
name = "pykas"
version = "0.1.0"
description = "Python gRPC client for Kaspa node"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools]
packages = ["pykas"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

